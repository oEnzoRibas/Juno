services:
  api:
    develop:
      watch:
        - action: rebuild
          path: ./apps/api/src
        - action: rebuild
          path: ./pnpm-lock.yaml
  web:
    command: ["pnpm", "--filter", "@juno/web", "dev"]
    environment:
      NODE_ENV: development
      JUNO_REVIEW_LIVE_SOURCE: '1'
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /workspace/apps/web/src
        - action: rebuild
          path: ./pnpm-lock.yaml
