x-juno-app: &juno-app
  build:
    context: .
    target: runtime
  image: ${JUNO_RUNTIME_IMAGE:-juno-runtime:${COMPOSE_PROJECT_NAME:-juno-production}}

services:
  db:
    image: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
    restart: unless-stopped
    environment:
      POSTGRES_DB: juno
      POSTGRES_USER: juno_migrator
      POSTGRES_PASSWORD: ${JUNO_MIGRATION_PASSWORD:?Set the installation migration password}
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'juno_migrator', '-d', 'juno']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *juno-app
    working_dir: /workspace/apps/api
    command: ['node', 'dist/database/migrate.js']
    environment:
      JUNO_MIGRATION_PASSWORD: ${JUNO_MIGRATION_PASSWORD:?Set the installation migration password}
      JUNO_DATABASE_PASSWORD: ${JUNO_DATABASE_PASSWORD:?Set the installation runtime database password}
      JUNO_DATABASE_HOST: db
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *juno-app
    restart: unless-stopped
    working_dir: /workspace/apps/api
    command: ['node', 'dist/main.js']
    environment:
      PORT: 3001
      JUNO_DATABASE_PASSWORD: ${JUNO_DATABASE_PASSWORD:?Set the installation runtime database password}
      JUNO_DATABASE_HOST: db
    networks:
      - default
      - database
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 4s
      timeout: 4s
      retries: 20

  web:
    <<: *juno-app
    restart: unless-stopped
    working_dir: /workspace/apps/web
    command: ['node', 'node_modules/next/dist/bin/next', 'start', '--hostname', '0.0.0.0']
    environment:
      JUNO_API_ORIGIN: http://api:3001
    ports:
      - '127.0.0.1:${JUNO_WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 4s
      timeout: 4s
      retries: 20

networks:
  database:
    internal: true

volumes:
  database:
