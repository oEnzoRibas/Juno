x-juno-app: &juno-app
  build:
    context: .
    target: runtime
  image: juno-runtime:${COMPOSE_PROJECT_NAME:-juno}

services:
  db:
    image: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
    environment:
      POSTGRES_DB: juno
      POSTGRES_USER: juno_migrator
      POSTGRES_PASSWORD: ${JUNO_MIGRATION_PASSWORD:?Set JUNO_MIGRATION_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juno_migrator -d juno"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *juno-app
    command: ["pnpm", "--filter", "@juno/api", "migrate"]
    environment:
      JUNO_MIGRATION_PASSWORD: ${JUNO_MIGRATION_PASSWORD:?Set JUNO_MIGRATION_PASSWORD in .env}
      JUNO_DATABASE_PASSWORD: ${JUNO_DATABASE_PASSWORD:?Set JUNO_DATABASE_PASSWORD in .env}
      JUNO_DATABASE_HOST: db
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *juno-app
    command: ["pnpm", "--filter", "@juno/api", "start"]
    environment:
      PORT: 3001
      JUNO_DATABASE_PASSWORD: ${JUNO_DATABASE_PASSWORD:?Set JUNO_DATABASE_PASSWORD in .env}
      JUNO_DATABASE_HOST: db
    networks:
      - default
      - database
    ports:
      - "127.0.0.1:${JUNO_API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 4s
      timeout: 4s
      retries: 20

  web:
    <<: *juno-app
    command: ["pnpm", "--filter", "@juno/web", "start"]
    ports:
      - "127.0.0.1:${JUNO_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 4s
      timeout: 4s
      retries: 20

networks:
  database:
    internal: true

volumes:
  database:
