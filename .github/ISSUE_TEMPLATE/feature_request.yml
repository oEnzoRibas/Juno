name: Feature proposal
description: Propose an improvement to Juno for Junior Enterprises.
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Identify affected roles and the workflow or unmet need. Use synthetic examples.
    validations:
      required: true
  - type: textarea
    id: outcomes
    attributes:
      label: Desired outcome and acceptance criteria
      description: Describe observable success, including permissions and tenant visibility when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Describe current workarounds, dependencies, or effects on security, privacy, accessibility, or localization.
  - type: textarea
    id: roadmap
    attributes:
      label: Related requirements or roadmap phase
      description: Link related issues, specifications, or decisions if known.
