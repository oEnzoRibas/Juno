oke="none" pointer-events="all"/></g><g><g fill="#231844" font-family="Arial" text-anchor="start" font-size="15px" style="fill: rgb(35, 24, 68);"><text x="28" y="262.5">Tenant and actor IDs are transaction-local. Missing or unauthorized scope returns 404.</text></g></g></g><g data-cell-id="retry"><g><rect x="26" y="276" width="930" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#231844" font-family="Arial" text-anchor="start" font-size="15px" style="fill: rgb(35, 24, 68);"><text x="28" y="298.5">An unchanged replacement returns the profile without appending another event.</text></g></g></g><g data-cell-id="credits"><g><rect x="26" y="345" width="930" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#59467E" font-family="Arial" text-anchor="start" font-size="13px" style="fill: rgb(89, 70, 126);"><text x="28" y="366.5">Original project creator: Enzo Ribas · Developed with AI assistance</text></g></g></g></g></g></g></svg>